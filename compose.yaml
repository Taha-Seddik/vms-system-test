name: vms-assessment

x-camera-generator: &camera-generator
  image: vms-camera-generator:local
  build:
    context: ./infra/camera-generator
  restart: unless-stopped
  depends_on:
    mediamtx:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "pidof ffmpeg >/dev/null || exit 1"]
    interval: 10s
    timeout: 3s
    start_period: 15s
    retries: 6
  networks:
    - vms

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms}
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vms_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vms

  mediamtx:
    build:
      context: ./infra/mediamtx
    image: vms-mediamtx:local
    restart: unless-stopped
    command: /mediamtx.yml
    ports:
      - "${RTSP_PORT:-8554}:8554"
      - "${HLS_PORT:-8888}:8888"
      - "${MEDIAMTX_API_PORT:-9997}:9997"
      - "${MEDIAMTX_METRICS_PORT:-9998}:9998"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9997/v3/paths/list || exit 1",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    networks:
      - vms

  camera-1:
    <<: *camera-generator
    environment:
      CAMERA_PATH: camera-1
      CAMERA_LABEL: Camera 1 - Entrance
      CAMERA_HUE: 0

  camera-2:
    <<: *camera-generator
    environment:
      CAMERA_PATH: camera-2
      CAMERA_LABEL: Camera 2 - Loading Bay
      CAMERA_HUE: 70

  camera-3:
    <<: *camera-generator
    environment:
      CAMERA_PATH: camera-3
      CAMERA_LABEL: Camera 3 - Parking
      CAMERA_HUE: 150

  camera-4:
    <<: *camera-generator
    environment:
      CAMERA_PATH: camera-4
      CAMERA_LABEL: Camera 4 - Warehouse
      CAMERA_HUE: 230

  api:
    image: vms-api:local
    build:
      context: ./backend
      dockerfile: Vms.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__VmsDatabase: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-vms};
        Username=${POSTGRES_USER:-vms};Password=${POSTGRES_PASSWORD:-vms_dev_password}
      Jwt__Issuer: ${JWT_ISSUER:-vms-api}
      Jwt__Audience: ${JWT_AUDIENCE:-vms-web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-production-2026}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Vms.Api.dll", "--health-check"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks:
      - vms

  frontend:
    image: vms-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_HLS_BASE_URL: ${VITE_HLS_BASE_URL:-http://localhost:8888}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    networks:
      - vms

volumes:
  postgres-data:

networks:
  vms:
    driver: bridge
